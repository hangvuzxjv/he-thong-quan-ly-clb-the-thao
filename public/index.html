<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan Fitness - Enterprise Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.12/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.12/dist/sweetalert2.all.min.js"></script>
</head>
<body>

    <div id="login-layout" class="vh-100 w-100 d-flex justify-content-center align-items-center" style="background: #f1f5f9;">
        <div class="card shadow-sm border-0 rounded-4 p-5" style="width: 420px; background: #ffffff;">
            <div class="text-center mb-4">
                <div class="avatar text-white rounded-circle d-flex justify-content-center align-items-center mx-auto mb-3" style="width: 70px; height: 70px; font-size: 30px;">
                    <i class="fa-solid fa-dumbbell"></i>
                </div>
                <h3 class="fw-bolder text-dark mb-1 tracking-wider">TITAN FITNESS</h3>
                <p class="text-muted small text-uppercase fw-bold">Management System</p>
            </div>
            
            <form id="loginForm" onsubmit="AppController.processLogin(event)">
                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold text-dark">Tên đăng nhập</label>
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" id="loginUsername" class="form-control border-start-0 bg-light fs-6" placeholder="admin hoặc letan_lan" required>
                    </div>
                </div>
                
                <div class="mb-4 text-start">
                    <label class="form-label small fw-bold text-dark">Mật khẩu bảo mật</label>
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" id="loginPassword" class="form-control border-start-0 bg-light fs-6" placeholder="••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm" style="background: linear-gradient(135deg, #4f46e5, #3b82f6); border: none;">
                    ĐĂNG NHẬP
                </button>
            </form>
        </div>
    </div>

    <div id="main-layout" class="d-flex w-100 d-none">
        <nav class="sidebar modern-sidebar shadow-lg">
            <div class="sidebar-header p-4 text-center border-bottom border-light border-opacity-10">
                <h4 class="text-white fw-bolder tracking-wider mb-0"><i class="fa-solid fa-dumbbell text-primary me-2"></i>TITAN</h4>
                <small class="text-secondary fw-medium text-uppercase" style="font-size: 0.7rem;">Management System</small>
            </div>
            
            <div class="sidebar-menu p-3 mt-2">
                <a href="#" class="nav-item nav-link-custom active" data-target="dashboard">
                    <i class="fa-solid fa-chart-pie me-3"></i> Tổng Quan
                </a>
                <a href="#" class="nav-item nav-link-custom" data-target="pos">
                    <i class="fa-solid fa-cash-register me-3"></i> Quầy Thu Ngân (POS)
                </a>
                <!-- Khôi phục menu Đăng ký hội viên -->
                <a href="#" class="nav-item nav-link-custom" data-target="register">
                    <i class="fa-solid fa-user-plus me-3"></i> Đăng ký hội viên
                </a>
                <a href="#" class="nav-item nav-link-custom" data-target="danh-ba">
                    <i class="fa-solid fa-address-book me-3"></i> Danh bạ hội viên
                </a>
                
                <a href="#" class="nav-item nav-link-custom" data-target="shop">
                    <i class="fa-solid fa-bag-shopping me-3"></i> Gian hàng mua sắm
                </a>
            </div>
        </nav>

        <main class="main-content flex-grow-1 bg-light">
            <header class="top-header bg-white shadow-sm p-3 d-flex justify-content-between align-items-center mb-4">
                <h4 id="page-title" class="fw-bold text-dark mb-0 ms-2">Dashboard Thống Kê</h4>
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <button class="btn btn-light position-relative rounded-circle border-0 d-flex justify-content-center align-items-center" type="button" data-bs-toggle="dropdown" style="width: 42px; height: 42px;">
                            <i class="fa-solid fa-bell text-muted fs-5"></i>
                            <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.65rem;">0</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2" style="width: 340px;">
                            <li><h6 class="dropdown-header fw-bold text-dark fs-6">Thông báo hệ thống</h6></li>
                            <li><hr class="dropdown-divider"></li>
                            <div id="notifList">
                                <li><a class="dropdown-item py-2 text-muted text-center" href="#">Đang tải dữ liệu...</a></li>
                            </div>
                        </ul>
                    </div>

                    <div class="dropdown">
                        <div class="avatar rounded-circle d-flex justify-content-center align-items-center fw-bold shadow-sm" data-bs-toggle="dropdown" style="width: 42px; height: 42px; cursor: pointer;">
                            <i class="fa-solid fa-user fs-5"></i>
                        </div>
                        <ul class="dropdown-menu dropdown-menu-end mt-2" style="min-width: 240px;">
                            <li>
                                <div class="dropdown-item-text pb-2 pt-3 text-center">
                                    <h6 id="currentUserName" class="fw-bolder text-dark mb-1">Đang tải...</h6>
                                    <small id="currentUserRole" class="text-muted fw-bold">Vai trò</small>
                                </div>
                            </li>
                            <li><hr class="dropdown-divider my-2"></li>
                            <li>
                                <a class="dropdown-item text-danger fw-bold text-center py-2" href="#" onclick="AppController.logout()">
                                    <i class="fa-solid fa-lock me-2"></i> Khóa máy tính
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>

            <div id="app-viewport" class="container-fluid px-3 pb-5"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
